plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base { archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            logLevel = org.slf4j.event.Level.DEBUG
            if (project.hasProperty('selfmcpWindow')) {
                systemProperty 'selfmcp.window', project.property('selfmcpWindow').toString()
            }
            if (project.hasProperty('selfmcpWorld')) {
                systemProperty 'selfmcp.world', project.property('selfmcpWorld').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods { cagedmobsreborn { sourceSet(sourceSets.main) } }
}

dependencies {
    compileOnly 'mezz.jei:jei-26.2-neoforge:30.48.0.244'
    runtimeOnly 'mezz.jei:jei-26.2-neoforge:30.48.0.244'
    compileOnly 'maven.modrinth:jade:26.2.10+neoforge'
    runtimeOnly 'maven.modrinth:jade:26.2.10+neoforge'
    compileOnly 'com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:21.0.39'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
